[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-analytics-backend"
version = "0.1.0"
description = "FastAPI backend for AI-agent request analytics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0.36,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "python-multipart>=0.0.20,<1",
    "httpx>=0.28,<1",
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

